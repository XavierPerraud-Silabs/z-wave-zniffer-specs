name: Build the Zniffer API Specification

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  generate_docs:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read

    container:
      image: ghcr.io/z-wave-alliance/z-wave-spec-docker:main

    steps:
      - name: Checkout spec sources
        uses: actions/checkout@v4

      - name: Generate the spec document
        working-directory: .
        run: make VERBOSE=1

      - name: Archive generated PDF
        uses: actions/upload-artifact@v4
        with:
          name: z-wave-spec-zniffer-api-pdf
          path: build/*.pdf
